name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No `version:` here - pnpm/action-setup reads it from package.json's
      # "packageManager" field, and specifying both is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the build on any known moderate-or-worse vulnerability in the
      # full dependency tree (root package.json's pnpm.overrides is how
      # transitive ones like postcss get pinned to a patched version).
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Build node package
        run: pnpm --filter @shardis/node build

      - name: Test node package (unit + real-process integration tests)
        run: pnpm --filter @shardis/node test

      - name: Build and test CLI
        run: |
          pnpm --filter @shardis/cli build
          pnpm --filter @shardis/cli test

      - name: Type-check and test benchmarks
        run: |
          pnpm --filter @shardis/benchmarks lint
          pnpm --filter @shardis/benchmarks test

      - name: Test and build dashboard
        run: |
          pnpm --filter @shardis/dashboard lint
          pnpm --filter @shardis/dashboard test
          pnpm --filter @shardis/dashboard build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build node codec and CLI
        run: |
          pnpm --filter @shardis/node build
          pnpm --filter @shardis/cli build

      - name: Build and start the Compose cluster
        run: docker compose up -d --build

      - name: Wait for every node to become healthy
        run: |
          for port in 7001 7002 7003 7004 7005 7006; do
            timeout 90 bash -c "until curl -sf http://localhost:$port/healthz | grep -q '\"status\":\"ok\"'; do sleep 2; done"
          done

      - name: Verify a real CLI write and read
        run: |
          # This key is in shard-a's 0-5460 range, whose published port is 7001.
          node packages/cli/dist/shardis-cli.js --url ws://localhost:7001/ws SET ci-smoke-2 ci-smoke-value
          output=$(node packages/cli/dist/shardis-cli.js --url ws://localhost:7001/ws GET ci-smoke-2)
          echo "$output"
          echo "$output" | grep -q 'ci-smoke-value'

      - name: Verify topology health
        run: |
          test "$(curl -s http://localhost:7001/healthz | jq -r .shard)" = "shard-a"
          test "$(curl -s http://localhost:7003/healthz | jq -r .shard)" = "shard-b"
          test "$(curl -s http://localhost:7005/healthz | jq -r .shard)" = "shard-c"

      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down Compose
        if: always()
        run: docker compose down -v

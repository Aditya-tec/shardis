name: Chaos Benchmarks

on:
  workflow_dispatch: {}
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  compose-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bring up the full 6-node/3-shard cluster
        run: docker compose up -d --build

      - name: Wait for every node to report healthy
        run: |
          for port in 7001 7002 7003 7004 7005 7006; do
            timeout 60 bash -c "until curl -sf http://localhost:$port/healthz | grep -q '\"status\":\"ok\"'; do sleep 2; done"
          done

      - name: Confirm the topology matches cluster.config.local.json
        run: |
          set -e
          test "$(curl -s http://localhost:7001/healthz | jq -r .role)" = "leader"
          test "$(curl -s http://localhost:7002/healthz | jq -r .role)" = "follower"
          test "$(curl -s http://localhost:7001/healthz | jq -r .shard)" = "shard-a"
          test "$(curl -s http://localhost:7003/healthz | jq -r .shard)" = "shard-b"
          test "$(curl -s http://localhost:7005/healthz | jq -r .shard)" = "shard-c"

      - name: Tear down
        if: always()
        run: docker compose down -v

  benchmarks:
    runs-on: ubuntu-latest
    needs: compose-smoke-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # No `version:` here - pnpm/action-setup reads it from package.json's
      # "packageManager" field, and specifying both is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build node package
        run: pnpm --filter @shardis/node build

      - name: Run the full benchmark suite
        run: pnpm --filter @shardis/benchmarks bench:all

      - name: Commit updated docs/benchmarks.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks.md
          git diff --staged --quiet || git commit -m "chore: update benchmark results [skip ci]"
          git push
